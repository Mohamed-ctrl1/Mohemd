<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="heebo.css"><link rel="stylesheet" href="frank.css"><link rel="stylesheet" href="base.css">
<style>
.stage{background:#F2E9DA;color:#2B2119}
.grain{position:absolute;inset:0;z-index:1;opacity:.5;
  background:radial-gradient(ellipse at 70% 12%,rgba(255,255,255,.9) 0%,transparent 55%),
             radial-gradient(ellipse at 15% 95%,rgba(176,137,92,.30) 0%,transparent 55%)}
.ring{position:absolute;width:520px;height:520px;border:2px solid rgba(139,94,60,.22);border-radius:50%;
  right:-150px;top:120px;z-index:1}
.ring2{position:absolute;width:300px;height:300px;border:2px solid rgba(139,94,60,.18);border-radius:50%;
  left:-90px;bottom:200px;z-index:1}
.wrap{padding:74px 78px 60px}
.top{display:flex;justify-content:space-between;align-items:center;font-size:23px;
  font-weight:700;letter-spacing:4px;color:#8B5E3C;font-family:Heebo,sans-serif}
.hair{height:1px;background:#C6A784;margin-top:22px}
.kicker{margin-top:70px;font-size:30px;font-weight:700;color:#A6552E;letter-spacing:3px;font-family:Heebo,sans-serif}
h1{font-family:'Frank Ruhl Libre',serif;font-size:132px;font-weight:900;line-height:.94;
  margin-top:16px;letter-spacing:-2px;color:#2B2119}
h1 em{font-style:normal;color:#A6552E;display:block}
.sub{margin-top:30px;font-size:34px;line-height:1.5;color:#5C4A3B;font-family:Heebo,sans-serif;max-width:720px}
.menu{margin-top:44px;display:flex;flex-direction:column;gap:20px;max-width:760px}
.row{display:flex;align-items:baseline;gap:14px;font-family:Heebo,sans-serif}
.row .n{font-size:32px;font-weight:700;color:#2B2119;white-space:nowrap}
.row .d{flex:1;border-bottom:2px dotted #C6A784;transform:translateY(-8px)}
.row .q{font-size:28px;color:#8B5E3C;white-space:nowrap}
.pricebox{margin-top:auto;display:flex;align-items:center;justify-content:space-between;
  background:#2B2119;color:#F2E9DA;border-radius:24px;padding:38px 46px}
.pricebox .lbl{font-family:Heebo,sans-serif;font-size:32px;font-weight:700;line-height:1.35}
.pricebox .lbl small{display:block;font-size:24px;font-weight:400;color:#C6A784}
.pricebox .amt{font-family:'Frank Ruhl Libre',serif;font-size:124px;font-weight:900;line-height:.85;color:#E8C89A}
.foot{margin-top:28px;display:flex;justify-content:space-between;align-items:flex-end;font-family:Heebo,sans-serif}
.brand{font-family:'Frank Ruhl Libre',serif;font-size:50px;font-weight:900;letter-spacing:1px}
.info{text-align:left;font-size:25px;color:#6B5545;line-height:1.6}
</style></head><body><div class="stage">
<div class="grain"></div><div class="ring"></div><div class="ring2"></div>
<div class="wrap">
  <div class="top"><span>CAFE LUGANO</span><span>פתוח כל יום מ-07:00</span></div>
  <div class="hair"></div>
  <div class="kicker">ארוחת בוקר זוגית</div>
  <h1>בוקר טוב,<em>בשקט.</em></h1>
  <div class="sub">שני אנשים, שולחן אחד, בלי למהר לשום מקום.</div>
  <div class="menu">
    <div class="row"><span class="n">2 שתייה חמה</span><span class="d"></span><span class="q">קפה לבחירתכם</span></div>
    <div class="row"><span class="n">2 מנות ביצים</span><span class="d"></span><span class="q">חביתה או שקשוקה</span></div>
    <div class="row"><span class="n">סלסלת מאפים</span><span class="d"></span><span class="q">אפייה של הבוקר</span></div>
    <div class="row"><span class="n">מיץ תפוזים סחוט</span><span class="d"></span><span class="q">2 כוסות</span></div>
  </div>
  <div class="pricebox">
    <div class="lbl">הכל בשניים<small>בימים א׳–ה׳ · 07:00–12:00</small></div>
    <div class="amt num">₪89</div>
  </div>
  <div class="foot">
    <div class="brand">Cafe Lugano</div>
    <div class="info"><div class="num">@cafe.lugano</div><div class="num">03-000-0000</div></div>
  </div>
</div></div></body></html>
