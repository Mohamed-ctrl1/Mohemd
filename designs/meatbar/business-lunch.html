<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="heebo.css"><link rel="stylesheet" href="frank.css"><link rel="stylesheet" href="base.css">
<style>
.stage{background:#121110;color:#EDE3D4}
.bg{position:absolute;inset:0;z-index:1;
  background:linear-gradient(200deg,rgba(210,84,47,.30) 0%,transparent 42%),
             radial-gradient(ellipse at 20% 100%,rgba(201,162,39,.22) 0%,transparent 55%)}
.frame{position:absolute;inset:34px;border:1px solid rgba(237,227,212,.22);z-index:1;border-radius:6px}
.wrap{padding:96px 92px 84px}
.top{display:flex;justify-content:space-between;align-items:center;font-family:Heebo,sans-serif;
  font-size:22px;font-weight:700;letter-spacing:5px;color:#C9A227}
.kicker{margin-top:78px;font-family:Heebo,sans-serif;font-size:28px;font-weight:700;
  letter-spacing:4px;color:#D2542F}
h1{font-family:'Frank Ruhl Libre',serif;font-size:118px;font-weight:900;line-height:1.0;
  margin-top:14px;letter-spacing:-2px}
.lead{margin-top:24px;font-family:Heebo,sans-serif;font-size:31px;color:#A89B8B;max-width:700px;line-height:1.5}
.menu{margin-top:58px;display:flex;flex-direction:column;gap:30px}
.item{display:flex;align-items:baseline;gap:18px;font-family:Heebo,sans-serif}
.item .nm{font-size:40px;font-weight:700;color:#EDE3D4;white-space:nowrap}
.item .ds{flex:1;border-bottom:1px dashed rgba(237,227,212,.28);transform:translateY(-10px)}
.item .pr{font-family:'Frank Ruhl Libre',serif;font-size:52px;font-weight:900;color:#C9A227;white-space:nowrap}
.note{margin-top:20px;font-family:Heebo,sans-serif;font-size:26px;color:#8F8375}
.band{margin-top:auto;border-top:1px solid rgba(237,227,212,.22);padding-top:34px;
  display:flex;justify-content:space-between;align-items:flex-end;font-family:Heebo,sans-serif}
.hours{font-size:30px;font-weight:700;line-height:1.5}
.hours small{display:block;font-size:24px;font-weight:400;color:#A89B8B}
.contact{text-align:left;font-size:25px;color:#A89B8B;line-height:1.6}
.brand{margin-top:34px;text-align:center;font-family:'Frank Ruhl Libre',serif;
  font-size:62px;font-weight:900;letter-spacing:10px;color:#EDE3D4}
</style></head><body><div class="stage">
<div class="bg"></div><div class="frame"></div>
<div class="wrap">
  <div class="top"><span>MEATBAR</span><span>עסקית צהריים</span></div>
  <div class="kicker">א׳–ה׳ · 12:00–17:00</div>
  <h1>צהריים<br>כמו שצריך.</h1>
  <div class="lead">מנה ראשונה, עיקרית, תוספת ושתייה. בלי להתפשר על הבשר.</div>
  <div class="menu">
    <div class="item"><span class="nm">פרגית על האש</span><span class="ds"></span><span class="pr num">₪69</span></div>
    <div class="item"><span class="nm">המבורגר 220 גר׳</span><span class="ds"></span><span class="pr num">₪79</span></div>
    <div class="item"><span class="nm">אנטריקוט</span><span class="ds"></span><span class="pr num">₪98</span></div>
  </div>
  <div class="note">כל העסקיות כוללות לחם הבית, סלטים ושתייה קלה.</div>
  <div class="band">
    <div class="hours">הזמנת מקום<small class="num">03-000-0000</small></div>
    <div class="contact"><div class="num">@meatbar</div><div>רח׳ 00, תל אביב</div></div>
  </div>
  <div class="brand">MEATBAR</div>
</div></div></body></html>
