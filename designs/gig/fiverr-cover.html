<!DOCTYPE html><html lang="en" dir="ltr"><head><meta charset="utf-8">
<link rel="stylesheet" href="heebo.css"><link rel="stylesheet" href="frank.css"><link rel="stylesheet" href="base.css">
<style>
.stage{width:1280px;height:769px;background:#0E1013;color:#fff;font-family:Heebo,sans-serif}
.bg{position:absolute;inset:0;z-index:1;
  background:radial-gradient(ellipse at 18% 20%,rgba(224,178,82,.22) 0%,transparent 52%),
             radial-gradient(ellipse at 92% 88%,rgba(192,57,43,.28) 0%,transparent 55%)}
.wrap{padding:54px 0 54px 58px;display:flex;flex-direction:row;align-items:center;gap:30px;height:100%}
.left{flex:1 1 auto;min-width:0}
.tag{display:inline-block;background:rgba(224,178,82,.14);color:#E0B252;border:1px solid rgba(224,178,82,.4);
  font-size:19px;font-weight:700;letter-spacing:2px;padding:9px 18px;border-radius:999px}
h1{font-size:66px;font-weight:900;line-height:1.02;margin-top:24px;letter-spacing:-1.5px}
h1 span{color:#E0B252}
.sub{margin-top:22px;font-size:26px;color:#AEB4BD;line-height:1.5;max-width:560px}
.feat{margin-top:30px;display:flex;flex-direction:column;gap:12px}
.feat div{display:flex;align-items:center;gap:12px;font-size:23px;color:#E4E7EB}
.feat b{width:26px;height:26px;border-radius:50%;background:#E0B252;color:#111;flex:none;
  display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:900}
.langs{margin-top:32px;display:flex;gap:10px}
.langs span{border:1px solid rgba(255,255,255,.22);border-radius:10px;padding:10px 18px;
  font-size:20px;font-weight:700;color:#fff}
.right{flex:0 0 470px;width:470px;position:relative;height:100%}
.card{position:absolute;width:235px;border-radius:14px;overflow:hidden;
  box-shadow:0 26px 60px rgba(0,0,0,.65);border:1px solid rgba(255,255,255,.12)}
.card img{width:100%;display:block}
.c1{right:150px;top:24px;transform:rotate(-6deg)}
.c2{right:-6px;top:96px;transform:rotate(5deg)}
.c3{right:196px;top:376px;transform:rotate(4deg);width:215px}
.c4{right:26px;top:432px;transform:rotate(-4deg);width:215px}
</style></head><body><div class="stage">
<div class="bg"></div>
<div class="wrap">
  <div class="left">
    <span class="tag">HEBREW · ARABIC · ENGLISH</span>
    <h1>Instagram posts<br>that actually<br><span>sell.</span></h1>
    <div class="sub">Promo posts for restaurants, cafés, barbershops and gyms.</div>
    <div class="feat">
      <div><b>✓</b>Delivered in 24 hours</div>
      <div><b>✓</b>Ready-to-post 1080×1350</div>
      <div><b>✓</b>Unlimited text revisions</div>
    </div>
    <div class="langs"><span>עברית</span><span>العربية</span><span>English</span></div>
  </div>
  <div class="right">
    <div class="card c1"><img src="a.png"></div>
    <div class="card c2"><img src="c.png"></div>
    <div class="card c3"><img src="d.png"></div>
    <div class="card c4"><img src="b.png"></div>
  </div>
</div></div></body></html>
