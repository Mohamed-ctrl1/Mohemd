<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="heebo.css"><link rel="stylesheet" href="base.css">
<style>
.stage{background:#101010}
.bg{position:absolute;inset:0;z-index:1;
  background:radial-gradient(ellipse at 50% 32%,rgba(192,57,43,.55) 0%,rgba(192,57,43,.10) 45%,transparent 70%)}
.stripes{position:absolute;inset:0;z-index:1;opacity:.05;
  background:repeating-linear-gradient(-45deg,#fff 0 3px,transparent 3px 26px)}
.wrap{align-items:center;text-align:center;padding:78px 70px 62px}
.top{font-size:24px;font-weight:700;letter-spacing:3px;color:#E0B252}
.eyebrow{margin-top:60px;font-size:46px;font-weight:700;color:#fff}
.pct{font-size:290px;font-weight:900;color:#E0B252;line-height:.8;letter-spacing:-12px;margin-top:18px;
  text-shadow:0 12px 40px rgba(0,0,0,.6)}
.on{font-size:52px;font-weight:900;color:#fff;margin-top:14px}
.line{width:180px;height:4px;background:#C0392B;margin:38px 0 0;border-radius:3px}
.terms{margin-top:34px;display:flex;flex-direction:column;gap:14px}
.terms div{font-size:30px;color:#cbcbcb}
.terms span{color:#E0B252;font-weight:700}
.cta{margin-top:auto;width:100%;background:#C0392B;color:#fff;border-radius:20px;
  padding:30px 0;font-size:44px;font-weight:900}
.slogan{margin-top:44px;font-size:34px;color:#8f8f8f;font-weight:400}
.sub{margin-top:20px;font-size:27px;color:#9a9a9a}
.brand{margin-top:26px;font-size:46px;font-weight:900;letter-spacing:6px}
.brand i{color:#C0392B;font-style:normal}
</style></head><body><div class="stage">
<div class="bg"></div><div class="stripes"></div>
<div class="wrap">
  <div class="top">MEATBAL · גבעת שמואל</div>
  <div class="eyebrow">סטודנט בבר-אילן?</div>
  <div class="pct num">15%</div>
  <div class="on">הנחה על כל התפריט</div>
  <div class="line"></div>
  <div class="terms">
    <div>בהצגת <span>כרטיס סטודנט</span></div>
    <div>ימים <span>א׳–ה׳</span> · עד השעה 22:00</div>
    <div>באכילה במקום ובאיסוף עצמי</div>
  </div>
  <div class="slogan">גם לסטודנט מגיע בשר טוב</div>
  <div class="cta">רח׳ הרצל 00, גבעת שמואל</div>
  <div class="sub num">03-000-0000 · @meatbal.givat.shmuel</div>
  <div class="brand">MEAT<i>BAL</i></div>
</div></div></body></html>
