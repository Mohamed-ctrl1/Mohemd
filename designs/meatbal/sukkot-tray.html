<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="heebo.css"><link rel="stylesheet" href="base.css">
<style>
.glow{position:absolute;width:1150px;height:1150px;right:-340px;top:-300px;z-index:1;
  background:radial-gradient(circle,rgba(192,57,43,.60) 0%,rgba(192,57,43,.15) 38%,transparent 66%)}
.glow2{position:absolute;width:950px;height:950px;left:-340px;bottom:-360px;z-index:1;
  background:radial-gradient(circle,rgba(224,178,82,.30) 0%,transparent 64%)}
.top{display:flex;justify-content:space-between;align-items:center;
  font-size:24px;font-weight:700;letter-spacing:2px;color:#E0B252}
.top .dot{color:#6b6b6b;margin:0 10px}
.rule{height:2px;background:linear-gradient(to left,#E0B252,rgba(224,178,82,.05));margin-top:24px}
.pill{align-self:flex-start;margin-top:50px;background:#C0392B;color:#fff;
  font-size:27px;font-weight:900;letter-spacing:3px;padding:13px 32px;border-radius:999px}
h1{font-size:164px;font-weight:900;line-height:.86;margin-top:28px;letter-spacing:-4px}
h1 span{color:#E0B252;display:block}
.prod{margin-top:42px;font-size:54px;font-weight:700}
.list{margin-top:24px;display:flex;flex-direction:column;gap:15px}
.list div{font-size:31px;color:#cfcfcf;display:flex;align-items:center;gap:15px}
.list b{width:11px;height:11px;background:#E0B252;border-radius:50%;flex:none}
.price{display:flex;align-items:flex-end;gap:24px;margin-top:34px}
.price .now{font-size:160px;font-weight:900;color:#E0B252;line-height:.78;letter-spacing:-6px}
.price .was{font-size:54px;font-weight:700;color:#7d7d7d;text-decoration:line-through;padding-bottom:16px}
.price .per{font-size:30px;color:#bdbdbd;padding-bottom:20px}
.cta{margin-top:40px;background:#E0B252;color:#111;border-radius:20px;
  padding:28px 0;text-align:center;font-size:46px;font-weight:900}
.foot{margin-top:28px;display:flex;justify-content:space-between;align-items:center}
.brand{font-size:44px;font-weight:900;letter-spacing:5px}
.brand i{color:#C0392B;font-style:normal}
.handle{font-size:25px;color:#8f8f8f}
</style></head><body><div class="stage">
<div class="glow"></div><div class="glow2"></div>
<div class="wrap">
  <div class="top"><span>גבעת שמואל</span><span>משלוחים<span class="dot">•</span>איסוף עצמי</span></div>
  <div class="rule"></div>
  <div class="pill">מבצע סוכות</div>
  <h1>סוכות<span>על האש</span></h1>
  <div class="prod">מגש שיפודים לסוכה</div>
  <div class="list">
    <div><b></b>פרגית · כבד · אנטריקוט</div>
    <div><b></b>כולל לאפות, 4 סלטים ורטבים</div>
    <div><b></b>מספיק ל-6 סועדים</div>
  </div>
  <div class="spacer"></div>
  <div class="price"><span class="now num">₪149</span><span class="was num">₪189</span><span class="per">למגש</span></div>
  <div class="cta">להזמנות: <span class="num">03-000-0000</span></div>
  <div class="foot"><div class="brand">MEAT<i>BAL</i></div><div class="handle num">@meatbal.givat.shmuel</div></div>
</div></div></body></html>
